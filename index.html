<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>AI Resume Builder</h1>
</header>

<div class="container">

    <div class="form-section">
        <h2>Resume Form</h2>

        <input type="text" id="name" placeholder="Full Name">

        <input type="email" id="email" placeholder="Email">

        <input type="text" id="phone" placeholder="Phone Number">

        <input type="text" id="education" placeholder="Education">

        <textarea id="skills" placeholder="Skills"></textarea>

        <textarea id="experience" placeholder="Experience"></textarea>

        <button onclick="generateResume()">
            Generate Resume
        </button>
    </div>

    <div class="resume-section">
        <h2>Resume Preview</h2>

        <div id="resumeOutput">
            <p>Your Resume Will Appear Here</p>
        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
